# Tracks the floating ghcr.io/ggml-org/llama.cpp:server-cuda Docker tag.
# When llama.cpp publishes a new server image, this workflow pins the
# Dockerfile to its exact digest, names a release after the llama.cpp build
# number it contains (e.g. b10666), and publishes it - which makes RunPod Hub
# rebuild the template. Days without a new image produce no release.
name: Track latest llama.cpp

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest server-cuda digest
        id: resolve
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/ggml-org/llama.cpp:server-cuda --format '{{.Manifest.Digest}}')
          echo "Latest digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if grep -q "$DIGEST" Dockerfile; then
            echo "Dockerfile already pinned to this digest, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read llama.cpp build number from the image
        if: steps.resolve.outputs.changed == 'true'
        id: version
        run: |
          IMAGE="ghcr.io/ggml-org/llama.cpp:server-cuda@${{ steps.resolve.outputs.digest }}"
          LABELS=$(skopeo inspect "docker://$IMAGE" --format '{{ index .Labels "org.opencontainers.image.version" }} {{ index .Labels "org.opencontainers.image.created" }}' 2>/dev/null || true)
          VERSION=$(echo "$LABELS" | awk '{print $1}')
          CREATED=$(echo "$LABELS" | awk '{print $2}')
          if echo "$VERSION" | grep -Eq '^b[0-9]+$'; then
            TAG="$VERSION"
          else
            echo "Could not read the version label, falling back to a dated tag."
            TAG="v$(date -u +%Y.%m.%d)"
          fi
          if ! echo "$CREATED" | grep -Eq '^[0-9]{4}-'; then
            CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          TITLE="$TAG (${CREATED%T*})"
          echo "Release tag: $TAG, title: $TITLE, built: $CREATED"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

      - name: Pin Dockerfile, commit and release
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          sed -i -E "s|^FROM ghcr\.io/ggml-org/llama\.cpp:server-cuda.*$|FROM ghcr.io/ggml-org/llama.cpp:server-cuda@${{ steps.resolve.outputs.digest }}|" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "Pin llama.cpp base image to $TAG"
          git push origin HEAD:master
          gh release create "$TAG" --title "${{ steps.version.outputs.title }}" \
            --notes "llama.cpp $TAG, built ${{ steps.version.outputs.created }} (base image ghcr.io/ggml-org/llama.cpp:server-cuda@${{ steps.resolve.outputs.digest }})"
