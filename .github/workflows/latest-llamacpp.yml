# Tracks the floating ghcr.io/ggml-org/llama.cpp:server-cuda Docker tag.
# When llama.cpp publishes a new server image, this workflow pins the
# Dockerfile to its exact digest, names a release after the llama.cpp build
# number it contains (e.g. b10666), and publishes it - which makes RunPod Hub
# rebuild the template. Days without a new image produce no release.
name: Track latest llama.cpp

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest server-cuda digest
        id: resolve
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/ggml-org/llama.cpp:server-cuda --format '{{.Manifest.Digest}}')
          echo "Latest digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if grep -q "$DIGEST" Dockerfile && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Dockerfile already pinned to this digest, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # Manual runs always release, so template changes can be
            # published to RunPod Hub without waiting for a llama.cpp bump.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read llama.cpp build number from the image
        if: steps.resolve.outputs.changed == 'true'
        id: version
        run: |
          # Read the OCI version/created labels from the image config via the
          # registry API (no image pull needed).
          REPO="ggml-org/llama.cpp"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json"
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          MANIFEST=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" "https://ghcr.io/v2/${REPO}/manifests/${{ steps.resolve.outputs.digest }}")
          CHILD=$(echo "$MANIFEST" | jq -r '.manifests[]? | select(.platform.architecture=="amd64") | .digest' | head -n1)
          if [ -n "$CHILD" ]; then
            MANIFEST=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" "https://ghcr.io/v2/${REPO}/manifests/${CHILD}")
          fi
          CONFIG_DIGEST=$(echo "$MANIFEST" | jq -r '.config.digest // empty')
          LABELS="{}"
          if [ -n "$CONFIG_DIGEST" ]; then
            LABELS=$(curl -sfL -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO}/blobs/${CONFIG_DIGEST}" | jq '.config.Labels // {}')
          fi
          VERSION=$(echo "$LABELS" | jq -r '."org.opencontainers.image.version" // empty')
          CREATED=$(echo "$LABELS" | jq -r '."org.opencontainers.image.created" // empty')
          if echo "$VERSION" | grep -Eq '^b[0-9]+$'; then
            TAG="$VERSION"
          else
            echo "Could not read the version label, falling back to a dated tag."
            TAG="v$(date -u +%Y.%m.%d)"
          fi
          if ! echo "$CREATED" | grep -Eq '^[0-9]{4}-'; then
            CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          echo "Release tag: $TAG, built: $CREATED"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

      - name: Pin Dockerfile, commit and release
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # RunPod Hub only picks up new releases, never moved or reused
          # tags - so if this tag exists (e.g. a template change without a
          # llama.cpp bump), publish under an incremented suffix instead.
          BASE_TAG="$TAG"
          N=2
          while gh release view "$TAG" > /dev/null 2>&1; do
            TAG="${BASE_TAG}-${N}"
            N=$((N+1))
          done
          sed -i -E "s|^FROM ghcr\.io/ggml-org/llama\.cpp:server-cuda.*$|FROM ghcr.io/ggml-org/llama.cpp:server-cuda@${{ steps.resolve.outputs.digest }}|" Dockerfile
          if ! git diff --quiet Dockerfile; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Dockerfile
            git commit -m "Pin llama.cpp base image to $TAG"
            git push origin HEAD:master
          fi
          CREATED="${{ steps.version.outputs.created }}"
          gh release create "$TAG" --title "$TAG (${CREATED%T*})" \
            --notes "llama.cpp ${{ steps.version.outputs.tag }}, built $CREATED (base image ghcr.io/ggml-org/llama.cpp:server-cuda@${{ steps.resolve.outputs.digest }})"
