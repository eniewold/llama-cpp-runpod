# Publishes a dated GitHub release every day. RunPod Hub builds the Docker
# image from the newest release, and the base image tag
# ghcr.io/ggml-org/llama.cpp:server-cuda always points at the latest llama.cpp
# build - so a daily release keeps deployed templates on a recent llama.cpp.
name: Daily release

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" \
            --notes "Automated daily release so the RunPod Hub image is rebuilt against the latest ghcr.io/ggml-org/llama.cpp:server-cuda base image."
